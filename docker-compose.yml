services:
  app:
    build: .
    # ports:
    #   - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/estate-management
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
    depends_on:
      - mongodb
      - redis
      - jaeger
    networks:
      - estate-net

  mongodb:
    image: mongodb/mongodb-community-server:latest
    ports:
      - "27017:27017"
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongodb:27017' }] }).ok }"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    volumes:
      - mongodb_data:/data/db
    networks:
      - estate-net

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    networks:
      - estate-net

  dozzle:
    image: amir20/dozzle:latest
    environment:
      - DOZZLE_USERNAME=${OBSERVABILITY_USERNAME:-admin}
      - DOZZLE_PASSWORD=${OBSERVABILITY_PASSWORD:-password123}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8080:8080"
    networks:
      - estate-net

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - app
    networks:
      - estate-net

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - estate-net
    # Port 16686 is NOT exposed directly, will be proxied via Nginx with Auth

networks:
  estate-net:
    driver: bridge

volumes:
  mongodb_data:
